# ===== 服务端口 =====
server.port=${SERVER_PORT:8081}

# ===== 数据源（生产环境通过 /etc/myweb/myweb.env 注入，避免密码写死在代码里） =====
spring.datasource.url=${MYWEB_DB_URL:jdbc:mysql://127.0.0.1:3306/myweb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYWEB_DB_USER:myweb}
spring.datasource.password=${MYWEB_DB_PASSWORD:change-me}

# ===== JPA =====
# 表结构完全由 Flyway 迁移管理，禁止 Hibernate 自动改表
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Flyway 版本化迁移 =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
